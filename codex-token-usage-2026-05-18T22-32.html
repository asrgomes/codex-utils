<style>
:root {
  color-scheme: dark;
  --bg: #0f141b;
  --panel: #171d26;
  --panel-2: #111821;
  --text: #f3f6fb;
  --muted: #a6b0bf;
  --line: #2a3442;
  --accent: #42c6b5;
  --accent-2: #f0b65a;
  --danger: #ff7a7a;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
header { padding: 24px 28px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; }
h2 { margin: 0 0 12px; font-size: 17px; letter-spacing: 0; }
p { margin: 0; color: var(--muted); }
.params { margin-top: 14px; }
.params h2 { margin-bottom: 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; }
.params dl { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
.params div { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--panel-2); }
.params dt { margin: 0 0 2px; color: var(--muted); font-size: 11px; }
.params dd { margin: 0; color: var(--text); font-size: 13px; overflow-wrap: anywhere; }
main { max-width: 1420px; margin: 0 auto; padding: 20px 24px 36px; display: grid; gap: 18px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(6, minmax(130px, 1fr)); gap: 12px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--panel-2); min-height: 86px; }
.kpi span { display: block; color: var(--muted); font-size: 12px; }
.kpi strong { display: block; margin-top: 8px; font-size: 22px; overflow-wrap: anywhere; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { font: inherit; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--text); padding: 8px 10px; }
button { cursor: pointer; background: var(--accent); border-color: var(--accent); color: #07110f; }
button.secondary { background: var(--panel-2); color: var(--accent); }
.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 860px; }
th, td { border-bottom: 1px solid var(--line); padding: 9px 10px; text-align: left; vertical-align: top; }
th { background: #1f2937; font-size: 12px; color: #d7dee9; position: sticky; top: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover { background: #1b2633; }
.chart-shell { position: relative; height: 320px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); padding: 10px; }
canvas { display: block; width: 100% !important; height: 100% !important; }
.diag-warning { color: var(--danger); }
.diag-info { color: var(--muted); }
.muted { color: var(--muted); }
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, minmax(130px, 1fr)); } }
@media (max-width: 700px) { .grid { grid-template-columns: repeat(2, minmax(130px, 1fr)); } main { padding: 14px; } }
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById('usage-data').textContent);
const TOKEN_KEYS = ['total_tokens', 'input_tokens', 'cached_input_tokens', 'output_tokens', 'reasoning_output_tokens'];
const fmt = new Intl.NumberFormat();
const usdFmt = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dateTimeFmt = new Intl.DateTimeFormat(undefined, { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
const chartDateTimeFmt = new Intl.DateTimeFormat(undefined, { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
const chartDateFmt = new Intl.DateTimeFormat(undefined, { month: 'numeric', day: 'numeric' });
function text(value) { return value == null ? '' : String(value); }
function number(value) { return Number(value || 0); }
function cell(value, className) {
  const td = document.createElement('td');
  td.textContent = text(value);
  if (className) td.className = className;
  return td;
}
function download(name, content, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function csvEscape(value) {
  const s = text(value);
  return /[",\n]/.test(s) ? '"' + s.replaceAll('"', '""') + '"' : s;
}
function bucketLabel(value) {

  const date = new Date(raw);
  return Number.isNaN(date.getTime()) ? raw : dateTimeFmt.format(date);
}
function chartLabel(value) {
  const raw = text(value);
  const date = new Date(raw);
  if (Number.isNaN(date.getTime())) return raw;
  if (number(DATA.metadata.bucketSeconds) >= 24 * 60 * 60) return chartDateFmt.format(date);
  return chartDateTimeFmt.format(date);
}
function kpiValue(value) {
  return typeof value === 'number' ? fmt.format(value) : text(value);

function usd(value) { return usdFmt.format(number(value)); }

}
function renderKpis() {
  const kpis = document.getElementById('kpis');
  kpis.replaceChildren();
  const buckets = DATA.periodBreakdown || [];

  const usedBuckets = buckets.filter(row => number(row.total_tokens) > 0).length;
  const peak = peakBucket();
  const cards = [
    [number(cost.unpricedTokens) > 0 ? 'USD estimate (priced only)' : 'USD estimate', usd(cost.estimatedCostUsd)],
    ['Period total', DATA.totals.total_tokens],
    ['Input tokens', DATA.totals.input_tokens],
    ['Cached input', DATA.totals.cached_input_tokens],
    ['Output tokens', DATA.totals.output_tokens],
    ['Reasoning output', DATA.totals.reasoning_output_tokens],
    ['Unpriced tokens', number(cost.unpricedTokens)],
    ['Buckets with usage', usedBuckets + ' / ' + buckets.length],
    ['Peak bucket', number(peak.total_tokens)],
  ];
  for (const [label, value] of cards) {
    const div = document.createElement('div');
    div.className = 'kpi';
    const span = document.createElement('span');
    span.textContent = label;
    const strong = document.createElement('strong');
    strong.textContent = kpiValue(value);
    div.append(span, strong);
    kpis.appendChild(div);
  }
}
function renderReportParams() {
  const params = document.getElementById('reportParams');
  params.replaceChildren();
  const rows = [
    ['Since', DATA.metadata.sinceOption || '30d'],
    ['Period start', DATA.metadata.since],
    ['Period end', DATA.metadata.periodEnd],
    ['Timezone', DATA.metadata.timezone],
    ['Bucket size', DATA.metadata.bucketSize],
    ['Pricing', ((DATA.costEstimate || {}).pricingSource || '') + ((DATA.costEstimate || {}).pricingUpdated ? ' checked ' + (DATA.costEstimate || {}).pricingUpdated : '')],
    ['Codex home', DATA.metadata.codexHome],
    ['Sessions root', DATA.metadata.sessionsRoot],
    ['Output', DATA.metadata.outputPath],
    ['Data source', DATA.metadata.stateDbPresent ? 'state_5.sqlite plus rollouts' : 'rollout JSONLs'],
    ['Redacted', DATA.metadata.redacted ? 'yes' : 'no'],
  ];
  for (const [label, value] of rows) {
    if (value === undefined || value === null || value === '') continue;
    const wrapper = document.createElement('div');
    const dt = document.createElement('dt');
    const dd = document.createElement('dd');
    dt.textContent = label;
    dd.textContent = text(value);
    wrapper.append(dt, dd);
    params.appendChild(wrapper);
  }
}

  document.getElementById('costSummary').textContent =
    'Estimated with ' + text(cost.pricingSource || 'embedded token rates') +
    '. Priced tokens: ' + fmt.format(priced) + '. Unpriced tokens: ' + fmt.format(unpriced) + '.' +
    pricedOnly + ' Long-context events: ' + fmt.format(longCtxEvents) + '. ' +
    'Excludes plan credits, taxes, batch/priority multipliers, regional surcharges, and non-token tool charges.';
  const body = document.getElementById('costRows');
  body.replaceChildren();
  for (const row of cost.byModel || []) {
    const tr = document.createElement('tr');
    tr.append(
      cell(row.model),
      cell(usd(row.estimated_cost_usd), 'num'),
      cell(fmt.format(number(row.total_tokens)), 'num'),
      cell(usd(row.input_usd_per_million), 'num'),
      cell(usd(row.cached_input_usd_per_million), 'num'),
      cell(usd(row.output_usd_per_million), 'num'),
      cell(fmt.format(number(row.long_context_events)), 'num')
    );
    body.appendChild(tr);
  }
  for (const row of cost.unpricedModels || []) {
    const tr = document.createElement('tr');
    tr.append(
      cell(row.model || 'unknown'),
      cell('unpriced', 'num'),
      cell(fmt.format(number(row.total_tokens)), 'num'),
      cell('', 'num'),
      cell('', 'num'),
      cell('', 'num'),
      cell('', 'num')
    );
    body.appendChild(tr);
  }
  if (!body.children.length) {
    const tr = document.createElement('tr');
    const td = cell('No priced token usage in this period.');
    td.colSpan = 7;
    tr.appendChild(td);
    body.appendChild(tr);
  }
}
function renderPeriodRows() {
  const body = document.getElementById('periodRows');
  body.replaceChildren();
  for (const row of DATA.periodBreakdown || []) {
    const tr = document.createElement('tr');
    tr.append(
      cell(bucketLabel(row.start)),
      cell(bucketLabel(row.end)),
      cell(usd(row.estimated_cost_usd), 'num'),
      cell(fmt.format(number(row.total_tokens)), 'num'),
      cell(fmt.format(number(row.input_tokens)), 'num'),
      cell(fmt.format(number(row.cached_input_tokens)), 'num'),
      cell(fmt.format(number(row.output_tokens)), 'num'),
      cell(fmt.format(number(row.reasoning_output_tokens)), 'num'),
      cell(fmt.format(number(row.event_count)), 'num'),
      cell(fmt.format(number(row.long_context_events)), 'num'),
      cell(fmt.format(number(row.active_threads)), 'num'),
      cell(fmt.format(number(row.unpriced_tokens)), 'num')
    );
    body.appendChild(tr);
  }
  document.getElementById('bucketLine').textContent = 'Bucket size: ' + text(DATA.metadata.bucketSize || '') + '. Events counted: ' + fmt.format(number(DATA.metadata.eventCount)) + '.';
}
function renderDiagnostics() {
  const list = document.getElementById('diagnostics');
  list.replaceChildren();
  const diagnostics = DATA.diagnostics && DATA.diagnostics.length ? DATA.diagnostics : [{ level: 'info', message: 'No diagnostics.' }];
  for (const diag of diagnostics) {
    const li = document.createElement('li');
    li.className = diag.level === 'warning' ? 'diag-warning' : 'diag-info';
    li.textContent = diag.count ? fmt.format(number(diag.count)) + ' - ' + diag.message : diag.message;
    list.appendChild(li);
  }
}
function renderChart() {
  const canvas = document.getElementById('tokenChart');
  const rows = DATA.periodBreakdown || [];
  if (!window.Chart) {
    canvas.replaceWith(document.createTextNode('Chart.js did not load from the CDN.'));
    return;
  }
  new Chart(canvas, {
    type: 'bar',
    data: {
      labels: rows.map(row => chartLabel(row.start)),
      datasets: [
        {
          label: 'Total tokens',
          data: rows.map(row => number(row.total_tokens)),
          backgroundColor: '#42c6b5',
          borderColor: '#7de1d4',
          borderWidth: 1,
          maxBarThickness: 34,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            afterBody(items) {
              const row = rows[(items[0] || {}).dataIndex] || {};
              return [
                'Input: ' + fmt.format(number(row.input_tokens)),
                'Cached input: ' + fmt.format(number(row.cached_input_tokens)),
                'Output: ' + fmt.format(number(row.output_tokens)),
                'Reasoning output: ' + fmt.format(number(row.reasoning_output_tokens)),
                'Estimated USD: ' + usd(row.estimated_cost_usd),
                'Events: ' + fmt.format(number(row.event_count)),
                'Active threads: ' + fmt.format(number(row.active_threads)),
              ];
            },
          },
        },
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: { autoSkip: true, maxRotation: 0, minRotation: 0, maxTicksLimit: 12, color: '#a6b0bf' },
        },
        y: {
          beginAtZero: true,
          grid: { color: '#263241' },
          ticks: { color: '#a6b0bf', callback: value => fmt.format(value) },
        },
      },
    },
  });
}
function setupExports() {
  document.getElementById('exportJson').addEventListener('click', () => download('codex-token-usage.json', JSON.stringify(DATA, null, 2), 'application/json'));
  document.getElementById('exportCsv').addEventListener('click', () => {
    const header = ['start','end','bucket','estimated_cost_usd','total_tokens','input_tokens','cached_input_tokens','output_tokens','reasoning_output_tokens','event_count','long_context_events','active_threads','unpriced_tokens'];
    const lines = [header.join(',')];
    for (const row of DATA.periodBreakdown || []) {
      lines.push(header.map(key => csvEscape(key === 'estimated_cost_usd' ? usdNumber(row[key]) : row[key])).join(','));
    }
    download('codex-token-usage.csv', lines.join('\n') + '\n', 'text/csv');
  });
}
document.getElementById('summaryLine').textContent = 'Period: ' + text(DATA.metadata.since || '') + ' through ' + text(DATA.metadata.periodEnd || '') + '. Data source: ' + (DATA.metadata.stateDbPresent ? 'state_5.sqlite plus rollouts' : 'rollout JSONLs') + '.';
renderReportParams();
renderKpis();
renderCostEstimate();
renderPeriodRows();
renderChart();
renderDiagnostics();
setupExports();
</script>
</body>
</html>
